<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App QA Dashboard</title>
  <style>html,body{background:#08071b}</style>
  <link rel="prefetch" href="/" as="document">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tc-studio/reference-variables.css">
  <link rel="stylesheet" href="/static/tc-studio/reference-layout.css">
  <link rel="stylesheet" href="/static/tc-studio/tc-studio.css">
  <link rel="stylesheet" href="/static/tc-studio/standalone.css">
</head>
<body>
  <header class="header">
    <div class="live-indicator"><div class="live-dot"></div>LIVE</div>
    <a class="header-title" href="/">QA CONTROL CENTER</a>
    <div class="header-spacer"></div>
    <span class="header-meta">APP TC STUDIO</span>
  </header>
  <div class="studio-status-bar" aria-label="실행 상태">
    <div class="status-item"><span class="status-dot" id="dot-appium"></span><span id="txt-appium">확인 중...</span></div>
    <div class="status-divider"></div>
    <div class="status-item"><span class="status-dot" id="dot-device"></span><span id="txt-device">확인 중...</span></div>
    <div class="status-divider"></div>
    <div class="status-item"><span id="txt-automation" class="status-badge">자동화: 확인 중...</span></div>
    <div class="status-divider"></div>
    <div class="status-item">파이프라인: <span class="status-badge" id="txt-step">-</span></div>
    <div class="status-item" id="heal-row" hidden>힐링: <span id="heal-cnt"></span>회</div>
  </div>
  <div class="body-wrap">
    <aside class="sidebar" aria-label="주 메뉴">
      <div class="sidebar-scroll">
        <div class="sidebar-section">
          <div class="sidebar-label">개요</div>
          <a class="sidebar-item" data-view="dashboard" href="/?view=dashboard"><span class="sidebar-dot"></span><span class="sidebar-name">Dashboard</span></a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label">환경</div>
          <a class="sidebar-item" data-view="config" href="/?view=config"><span class="sidebar-dot"></span><span class="sidebar-name">환경 설정</span></a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label">TC 작성</div>
          <a class="sidebar-item active" data-view="tc_studio" href="/tc-studio" aria-current="page"><span class="sidebar-dot"></span><span class="sidebar-name">TC Studio</span></a>
          <a class="sidebar-item" data-view="capture" href="/?view=capture"><span class="sidebar-dot"></span><span class="sidebar-name">Capture Studio</span></a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label">파이프라인</div>
          <a class="sidebar-item" data-view="pipeline" href="/?view=pipeline"><span class="sidebar-dot"></span><span class="sidebar-name">파이프라인 실행</span></a>
          <a class="sidebar-item" data-view="tests" href="/?view=tests"><span class="sidebar-dot"></span><span class="sidebar-name">빠른 실행</span></a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label">테스트 결과</div>
          <a class="sidebar-item" data-view="reports" href="/?view=reports"><span class="sidebar-dot"></span><span class="sidebar-name">리포트 목록</span></a>
          <a class="sidebar-item" data-view="history" href="/?view=history"><span class="sidebar-dot"></span><span class="sidebar-name">실행 히스토리</span></a>
        </div>
      </div>
    </aside>
    <main class="content-wrap">
      <div class="content-scroll" id="tc-studio-root"></div>
    </main>
  </div>
  <script src="/static/tc-studio/api.js"></script>
  <script src="/static/tc-studio/state.js"></script>
  <script src="/static/tc-studio/detail.js"></script>
  <script src="/static/tc-studio/library.js"></script>
  <script src="/static/tc-studio/import.js"></script>
  <script src="/static/tc-studio/generate.js"></script>
  <script src="/static/tc-studio/connectors.js"></script>
  <script src="/static/tc-studio/review.js"></script>
  <script src="/static/tc-studio/export.js"></script>
  <script src="/static/tc-studio/main.js"></script>
  <script src="/static/tc-studio/standalone.js"></script>
</body>
</html>
