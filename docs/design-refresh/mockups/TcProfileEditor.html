<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작성 규칙 편집</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
</style>
<div style="min-height: 780px; background: #F5F6F8; color: #111827; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
<div style="min-height: 780px; background: rgba(17, 24, 39, 0.45); display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box"><div role="dialog" aria-modal="true" aria-label="작성 규칙 편집" style="width: 640px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgba(17, 24, 39, 0.18); overflow: hidden"><div style="display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #E2E5EA"><div style="flex-grow: 1"><h2 style="margin: 0; font-size: 17px; font-weight: 600">작성 규칙 편집</h2></div><button aria-label="닫기" style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; width: 34px; padding: 0">×</button></div><div style="padding: 20px"><div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">저장할 프로필 이름<input type="text" value="기본" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">규칙 (한 줄에 하나)<textarea rows="6" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: auto; padding: 10px 12px; line-height: 1.6">제공한 정보에 명시된 기능·조건·기대 결과를 기준으로 작성한다.&#10;TC 하나에는 하나의 검증 목적을 담고, 중복 케이스는 합친다.&#10;Step은 한 줄에 한 동작, Expected는 확인 가능한 결과와 원문 화면 문구로 작성한다.</textarea></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">금지 표현 (쉼표로 구분)<input type="text" value="정상 동작, 정상적으로 노출" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">Expected 끝맺음 (쉼표로 구분 · 비우면 검사하지 않음)<input type="text" placeholder="예: 된다., 는다." style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"></label>
<div style="display: flex; align-items: center; gap: 10px"><div style="font-size: 12px; color: #4B5563; flex-grow: 1">기준 예시</div><button style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap">엑셀에서 문체 가져오기</button></div>
<div style="padding: 14px; border: 1px dashed #8B93A1; border-radius: 6px; font-size: 13px; color: #4B5563">기준 예시 없음 — 엑셀에서 문체를 가져오면 채워집니다</div>
</div></div><div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid #E2E5EA"><button style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap">취소</button><button style="height: 34px; padding: 0 16px; background: #1F4FD1; color: #FEFEFE; border: 0; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap">저장</button></div></div></div>
</div>
</body>
</html>
