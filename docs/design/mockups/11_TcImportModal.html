<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TC 스튜디오 — 엑셀 가져오기 모달</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
</style>
<div style="min-height: 1000px; background: #F5F6F8; color: #111827; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
<div style="min-height: 1000px; background: rgba(17, 24, 39, 0.45); display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box"><div role="dialog" aria-modal="true" aria-label="엑셀을 라이브러리로 가져오기" style="width: 900px; max-width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 32px rgba(17, 24, 39, 0.18); overflow: hidden"><div style="display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #E2E5EA"><div style="flex-grow: 1"><h2 style="margin: 0; font-size: 17px; font-weight: 600">엑셀을 라이브러리로 가져오기</h2><p style="margin: 4px 0 0; font-size: 13px; color: #4B5563">파일 선택 → 열 매핑 → 변경 확인 → 가져오기</p></div><button aria-label="닫기" style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; width: 34px; padding: 0">×</button></div><div style="padding: 20px"><div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #E2E5EA; border-radius: 8px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #15803D">XLSX</span><span style="font-size: 14px; font-weight: 600; flex-grow: 1">[파일 이름].xlsx</span><span style="font-size: 12px; color: #6B7280">시트 3 · 926행</span><button style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; height: 28px; font-size: 12px">다른 파일</button></div>
<fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><legend style="font-size: 12px; color: #4B5563; padding: 0; margin-bottom: 8px">양식 인식</legend>
<label style="display: flex; gap: 12px; padding: 14px 16px; border: 1px solid #E2E5EA; border-radius: 8px; background: #FFFFFF; cursor: pointer"><input type="radio" name="fmt" style="width: 16px; height: 16px; margin: 0; accent-color: #1F4FD1; margin-top: 3px"><div><div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">기준 양식 자동 인식</div><div style="font-size: 13px; color: #4B5563; margin-top: 4px; line-height: 1.5">대분류·기능·Test Step·Expected Result 헤더를 찾습니다.</div></div></label><label style="display: flex; gap: 12px; padding: 14px 16px; border: 1px solid #1F4FD1; border-radius: 8px; background: #E8EEFC; cursor: pointer"><input type="radio" name="fmt" checked style="width: 16px; height: 16px; margin: 0; accent-color: #1F4FD1; margin-top: 3px"><div><div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">다른 양식 직접 매핑</div><div style="font-size: 13px; color: #4B5563; margin-top: 4px; line-height: 1.5">열을 직접 연결하고 프로필로 저장합니다.</div></div></label></fieldset>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: end"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">열 매핑 프로필<select style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"><option>직접 입력</option></select></label><button style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap">새 프로필 저장</button><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">헤더 행<input type="text" value="11" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; width: 72px; font-family: 'JetBrains Mono', monospace"></label></div>
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 120px minmax(0, 1fr); gap: 8px 12px"><div style="display: contents"><span style="font-size: 14px; align-self: center">원본 TC ID</span><select aria-label="원본 TC ID 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>A · No.</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">제목*</span><select aria-label="제목* 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>E · 기능</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">사전 조건</span><select aria-label="사전 조건 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>F · 사전 조건</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">대분류</span><select aria-label="대분류 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>B · 대분류</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">중분류</span><select aria-label="중분류 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>C · 중분류</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">소분류</span><select aria-label="소분류 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>D · 소분류</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">단계</span><select aria-label="단계 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>G · Test Step</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">기대 결과</span><select aria-label="기대 결과 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>H · Expected Result</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">우선순위</span><select aria-label="우선순위 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>I · 우선순위</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">And 결과</span><select aria-label="And 결과 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>K · 환경 › And</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">iOS 결과</span><select aria-label="iOS 결과 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>L · 환경 › iOS</option></select></div><div style="display: contents"><span style="font-size: 14px; align-self: center">태그</span><select aria-label="태그 열" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; height: 32px; font-size: 13px"><option>선택 안 함</option></select></div></div>
<div role="status" style="padding: 12px 14px; border-radius: 6px; background: #E8EEFC; color: #1F4FD1; font-size: 13px; line-height: 1.6"><b>앱 스위트로 인식</b><br>결과 열에 And·iOS가 있어 플랫폼별 결과를 따로 저장합니다. 한쪽이 NA인 행은 다른 쪽 전용 TC가 됩니다.</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">스위트 이름<input type="text" placeholder="예: 회원등록" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4B5563">case_id 접두어<input type="text" value="S01" style="height: 36px; padding: 0 12px; border: 1px solid #8B93A1; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111827; box-sizing: border-box; width: 100%; font-family: 'JetBrains Mono', monospace"></label></div>
<div style="padding: 12px 14px; background: #F0F2F5; border-radius: 6px; display: flex; gap: 8px; align-items: center; font-size: 13px"><b>변경 미리보기</b><span style="flex-grow: 1"></span><span style="display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; color: #1F4FD1; background: #E8EEFC">신규 905</span><span style="display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; color: #4B5563; background: #F0F2F5">갱신 0</span><span style="display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; color: #4B5563; background: #F0F2F5">동일 0</span><span style="display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; color: #4B5563; background: #F0F2F5">충돌 0</span><span style="display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; color: #B91C1C; background: #FDECEC">오류 21</span></div>
</div></div><div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid #E2E5EA"><a href="#" style="font-size: 13px; margin-right: auto">가져오기 이력</a><button style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap">취소</button><button style="height: 34px; padding: 0 14px; background: #FFFFFF; color: #111827; border: 1px solid #E2E5EA; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap">변경 미리보기</button><button style="height: 34px; padding: 0 16px; background: #1F4FD1; color: #FEFEFE; border: 0; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap">가져오기</button></div></div></div>
</div>
</body>
</html>
