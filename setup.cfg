[tool:pytest]
python_files = tc_*.py
python_classes = Test*
python_functions = test_*
# Android/iOS output folders can contain the same TC filename. Importlib mode
# keeps collection isolated by path instead of reusing the first basename.
addopts = --import-mode=importlib

[flake8]
max-line-length = 99
exclude = .git,__pycache__
# report_html.py contains HTML/CSS/JS template strings that cannot be line-wrapped
per-file-ignores =
    scripts/report_html.py:E501
